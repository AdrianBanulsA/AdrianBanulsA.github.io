name: Update scan counts

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: [posters.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scans
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Fetch counts
        run: python scripts/update_scans.py
      - name: Commit if changed
        run: |
          git diff --quiet README.md && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update scan counts"
          git push
