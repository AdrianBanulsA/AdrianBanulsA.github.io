site_name: Adrián Bañuls Arias
site_url: https://adrianbanulsa.github.io/
site_description: Adrián Bañuls Arias, predoctoral researcher at the University of Málaga working on reinforcement learning for mobile robots.
copyright: © 2026 Adrián Bañuls Arias

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: img/personal-logo.png
  favicon: img/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.tabs

extra_css:
  - stylesheets/extra.css

nav:
  - About: index.md
  - Publications: publications.md

extra:
  goatcounter: "adrianbanuls"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AdrianBanulsA
    - icon: fontawesome/brands/orcid
      link: https://orcid.org/0009-0004-8712-0431
    - icon: fontawesome/brands/google-scholar
      link: https://scholar.google.es/citations?user=P3HrRG8AAAAJ

markdown_extensions:
  - attr_list
  - md_in_html
